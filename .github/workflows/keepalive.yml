# Keeps the org Supabase auth instance from being paused for inactivity by
# pinging its auth health endpoint daily. The publishable key is client-safe
# by design and lives in a repo Actions VARIABLE (vars.*), not a secret.
name: auth-keepalive

on:
  schedule:
    - cron: '17 9 * * *' # daily 09:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping org auth health endpoint
        run: |
          curl -fsS -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ vars.SUPABASE_URL }}/auth/v1/health"
