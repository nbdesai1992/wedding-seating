# IaC documentation for the wedding-seating web service.
# Resources are provisioned autonomously via the Render API/CLI (not a Blueprint
# Instance): a dedicated Postgres `wedding-seating-db` (basic_256mb) is created via
# the API, and DATABASE_URL is wired onto this service at create time. Migrations run
# at server startup (free-tier services don't support a pre-deploy command).
services:
  - type: web
    name: wedding-seating
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        sync: false
      # Auth gate (BRIEF-003): org login via factory-auth. Values set via API at
      # integration time; the publishable key is client-safe (not a secret).
      - key: SUPABASE_URL
        value: "https://pvmmiqzmcfhylpyfqerd.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_URL
        value: "https://wedding-seating-ymzs.onrender.com"
