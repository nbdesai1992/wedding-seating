<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>By invitation — Seat &amp; Celebrate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
    .auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:48px 44px;max-width:460px;width:100%;text-align:center}
    .auth-card .orn svg{display:inline-block;vertical-align:middle}
    .auth-card h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:34px;line-height:1.15;margin:14px 0 16px}
    .auth-card p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 10px}
    .who{font-size:13px;color:var(--muted);margin:18px 0 24px}
    .who b{color:var(--ink);font-weight:600}
    .signout{background:none;border:none;padding:0;color:var(--sage-deep);font-size:13.5px;text-decoration:underline;cursor:pointer}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="orn" aria-hidden="true">
        <svg width="72" height="20" viewBox="0 0 72 20" fill="none" stroke="#c9a96a" stroke-width="1.3" stroke-linecap="round">
          <path d="M2 10 H24" /><path d="M48 10 H70" />
          <path d="M36 3.2 C32 3.2 30 5.6 30 8 C30 10.8 32.6 12.6 36 15 C39.4 12.6 42 10.8 42 8 C42 5.6 40 3.2 36 3.2 Z" />
          <circle cx="27" cy="10" r="0.9" fill="#c9a96a" stroke="none" /><circle cx="45" cy="10" r="0.9" fill="#c9a96a" stroke="none" />
        </svg>
      </div>
      <h1>This celebration is by invitation</h1>
      <p>Access to this planner is by invitation only. If you&rsquo;re expecting a place here, ask the host to add you to the guest list.</p>
      <div class="who">Signed in as <b>{{EMAIL}}</b></div>
      <form method="post" action="/logout">
        <button type="submit" class="signout">Sign out and use a different account</button>
      </form>
    </div>
  </div>
</body>
</html>
