<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Seat &amp; Celebrate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
    .auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:48px 44px;max-width:430px;width:100%;text-align:center}
    .auth-card .orn svg{display:inline-block;vertical-align:middle}
    .auth-card h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:38px;margin:14px 0 6px}
    .auth-card h1 .amp{color:var(--blush-deep);font-style:italic}
    .auth-card p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 28px}
    .notice{background:var(--blush-tint);color:#a5655c;border:1px solid #eed6d1;border-radius:12px;font-size:13.5px;line-height:1.5;padding:11px 14px;margin:0 0 20px;text-align:left}
    .btn.google{display:inline-flex;align-items:center;gap:11px;font-size:14.5px;padding:8px 22px 8px 8px;width:100%;justify-content:center}
    .gchip{background:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:none}
    .auth-foot{color:var(--muted);font-size:12.5px;margin-top:22px}
    @media (max-width:420px){.auth-card{padding:38px 26px}.auth-card h1{font-size:32px}}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="orn" aria-hidden="true">
        <svg width="72" height="20" viewBox="0 0 72 20" fill="none" stroke="#c9a96a" stroke-width="1.3" stroke-linecap="round">
          <path d="M2 10 H24" /><path d="M48 10 H70" />
          <path d="M36 3.2 C32 3.2 30 5.6 30 8 C30 10.8 32.6 12.6 36 15 C39.4 12.6 42 10.8 42 8 C42 5.6 40 3.2 36 3.2 Z" />
          <circle cx="27" cy="10" r="0.9" fill="#c9a96a" stroke="none" /><circle cx="45" cy="10" r="0.9" fill="#c9a96a" stroke="none" />
        </svg>
      </div>
      <h1>Seat <span class="amp">&amp;</span>&nbsp;Celebrate</h1>
      <p>Your tables, your guests, and the room you&rsquo;re lovingly arranging — sign in to continue.</p>
      <div class="notice hidden" id="err-note">That account doesn&rsquo;t have an invitation yet — ask the host, or try another account.</div>
      <form method="post" action="/login">
        <button type="submit" class="btn primary google">
          <span class="gchip">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          </span>
          Sign in with Google
        </button>
      </form>
      <div class="auth-foot">Access is by invitation.</div>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('err') === 'invite') {
      document.getElementById('err-note').classList.remove('hidden');
    }
  </script>
</body>
</html>
