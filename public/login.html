<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Seat &amp; Celebrate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
    .auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:48px 44px;max-width:430px;width:100%;text-align:center}
    .auth-card .orn{color:var(--gold);letter-spacing:.6em;font-size:15px}
    .auth-card h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:38px;margin:12px 0 6px}
    .auth-card h1 .amp{color:var(--blush-deep);font-style:italic}
    .auth-card p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 28px}
    .btn.google{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;padding:12px 26px;width:100%;justify-content:center}
    .auth-foot{color:var(--muted);font-size:12.5px;margin-top:22px}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="orn">&#10086; &#10086; &#10086;</div>
      <h1>Seat <span class="amp">&amp;</span> Celebrate</h1>
      <p>Welcome back — sign in to return to your tables, your guests, and the room you&rsquo;re lovingly arranging.</p>
      <form method="post" action="/login">
        <button type="submit" class="btn primary google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
          Sign in with Google
        </button>
      </form>
      <div class="auth-foot">Access is by invitation.</div>
    </div>
  </div>
</body>
</html>
